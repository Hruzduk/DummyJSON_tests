name: Daily API Tests

on:
  schedule:
    # Runs at 08:00 UTC every day (10:00 Kyiv time)
    - cron: '0 8 * * *'

  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  # Allows manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --alluredir=allure-results
      continue-on-error: true

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: gh-pages/allure-history
        keep_reports: 30

    - name: Deploy report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report

    - name: Post the link to the report
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const repoName = context.repo.repo;
          const ownerName = context.repo.owner;
          const reportUrl = `https://${ownerName}.github.io/${repoName}/`;

          const message = `📊 Allure Report: ${reportUrl}`;

          if (context.eventName === 'pull_request') {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: ownerName,
              repo: repoName,
              body: message
            });
          }

          console.log(message);